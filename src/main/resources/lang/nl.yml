# GZMNBuildtools-berichten in het Nederlands. Elke sleutel is het Engelse
# bericht uit de code; de waarde is wat spelers met Nederlands als speltaal zien.
# Laat de plaatshouders (%s, %d, %.2f) staan; nummer ze (%2$s) om de volgorde
# te veranderen. Na een wijziging: /gzmnbuildtools reload.

