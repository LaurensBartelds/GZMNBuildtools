name: GZMNBuildtools
version: '${project.version}'
main: nl.gzmn.gZMNBuildtools.GZMNBuildtools
api-version: '26.2'
description: FAWE extension with terrain masks, patterns, brushes, shape generators, gradients and type replacement
author: GZMN
load: POSTWORLD

dependencies:
  server:
    FastAsyncWorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  gzmnbuildtools.*:
    description: Grants access to all GZMNBuildtools commands
    default: op
    children:
      gzmnbuildtools.typereplace: true
      gzmnbuildtools.gradient: true
      gzmnbuildtools.admin: true
      gzmnbuildtools.brush: true
      gzmnbuildtools.terrainbrush: true
      gzmnbuildtools.generate: true
      gzmnbuildtools.select: true
      gzmnbuildtools.swap: true
      gzmnbuildtools.weathering: true
      gzmnbuildtools.pixelart: true
      gzmnbuildtools.texture: true

  gzmnbuildtools.typereplace:
    description: Allows use of /typereplace command
    default: op

  gzmnbuildtools.gradient:
    description: Allows use of /gradient command
    default: op

  gzmnbuildtools.admin:
    description: Allows use of /gzmnbuildtools reload and other admin commands
    default: op

  gzmnbuildtools.brush:
    description: Allows use of the smart gradient brush (/gradientbrush, /gb)
    default: op

  gzmnbuildtools.terrainbrush:
    description: Allows binding and using /terrainbrush terrain brushes
    default: op

  gzmnbuildtools.generate:
    description: Allows use of /gzgen shape generators and /gzspline
    default: op

  gzmnbuildtools.select:
    description: Allows use of /gzselect to select the build you are looking at
    default: op

  gzmnbuildtools.swap:
    description: Allows use of the /gzswap material swap brush
    default: op

  gzmnbuildtools.weathering:
    description: Allows use of the /weathering brush
    default: op

  gzmnbuildtools.pixelart:
    description: Allows use of /gzpixelart
    default: op

  gzmnbuildtools.texture:
    description: Allows use of /gztexture
    default: op
