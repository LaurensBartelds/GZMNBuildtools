# GZMNBuildtools configuration.
#
# After editing, run /gzmnbuildtools reload or restart the server.

# Features you can switch off. A switched-off module registers no commands,
# listeners or web server. Changes here need a server restart; check the result
# with /gzmnbuildtools modules.
modules:
  masks-and-patterns: true   # #slope, #depth, #byslope, #stripes, ...
  gradient: true             # /gradient, saved gradients, #gradient
  type-replace: true         # /typereplace
  gradient-brush: true       # /gradientbrush (/gb)
  terrain-brushes: true      # /terrainbrush (/tb)
  generators: true           # /gzgen
  splines: true              # /gzspline
  web-editor: true           # browser editor for /gb (needs gradient-brush)
  build-select: true         # /gzselect
  material-swap: true        # /gzswap
  weathering: true           # /weathering (/age)
  pixel-art: true            # /gzpixelart
  terrain-texture: true      # /gztexture
  hover-preview: true        # /gzhover
  prefab-scatter: true       # /gzscatter
  roof: true                 # /gzroof

messages:
  # When true, extra per-operation diagnostic messages are shown to players
  # (e.g. per-variant block counts during /typereplace).
  verbose: false
  # Language of GZMN messages: "auto" follows each player's game language
  # (English when there is no translation), or a code such as "nl" for
  # everyone. Translations live in lang/<code>.yml; copy lang/en.yml to add one.
  language: auto

web-editor:
  enabled: true
  port: 8080
  host: 0.0.0.0
  # Address players open in their browser, e.g. "https://build.example.com" when the
  # editor sits behind a proxy. Empty = http://<server-ip or localhost>:<port>.
  public-url: ""
  # How long a personal /gb web link keeps working.
  session-minutes: 30

terrain-brushes:
  # Largest radius /terrainbrush accepts. FAWE's own limits (worldedit.limit) still apply.
  max-radius: 32

generation:
  # Largest number of blocks a single /gzgen shape may place.
  max-blocks: 500000

build-scan:
  # Largest connected build the build-aware tools (gradient brush, /gzselect,
  # /gzswap, /weathering) scan from a click, in blocks and in distance from the
  # clicked block. Bigger areas use the scanned part.
  max-blocks: 200000
  max-radius: 128

smart-gradient:
  # How long a scanned build is remembered so later strokes line up with it.
  cache-minutes: 10
  # Largest brush radius /gradientbrush, /gzswap and /weathering accept.
  max-radius: 32

palettes:
  # Blocks automatic palettes never use (glob patterns, * = anything). Leave
  # this out to use the built-in list of functional, light-emitting, falling
  # and patterned blocks.
  # exclude: ["*_ore", "sand", "gravel"]

loadouts:
  # Most saved loadouts a player may keep per brush (/gb save, /tb save).
  max-per-player: 30

pixel-art:
  # Largest picture side in blocks.
  max-size: 256
  # Images can come from plugins/GZMNBuildtools/images, or from web addresses
  # when allow-urls is true. Web downloads never go to localhost or private
  # networks unless allow-private-addresses is true, and never follow redirects.
  allow-urls: true
  allow-private-addresses: false
  max-download-kb: 8192
  # Images wider or taller than this (in pixels) are refused before decoding.
  max-image-dimension: 4096

terrain-texture:
  # Largest selection /gztexture works on (in blocks, width x height x length),
  # and the largest texture brush radius. Presets live in terrain-presets.yml.
  max-volume: 8000000
  max-radius: 32

hover:
  # /gzhover shows a live ghost of what the held brush would change where you
  # look. Players turn it on themselves unless this is true.
  enabled-by-default: false
  # How often to check where each player is looking (ticks), how far, and the
  # largest stroke that is previewed.
  interval-ticks: 4
  range: 64
  max-blocks: 4000

scatter:
  # /gzscatter places schematics from WorldEdit's schematics folder plus the
  # built-in tree:<style> and rock prefabs. Largest brush radius, largest
  # schematic accepted as a prefab, and most blocks one click may set.
  max-radius: 32
  max-prefab-blocks: 50000
  max-blocks-per-click: 50000

limits:
  # Give ranks their own limits instead of the settings above. A player gets
  # the highest value among their ranks (permission gzmnbuildtools.limits.<rank>),
  # and "default" applies to everyone. Limits no rank sets use the settings
  # above. gzmnbuildtools.limits.unlimited lifts them all. Players see theirs
  # with /gzlimits.
  #   radius:    brush radius (all GZMN brushes; //size is capped to it)
  #   blocks:    blocks one /gzgen, /gzspline or scatter click may place
  #   selection: blocks in a selection /gztexture works on
  #   image:     longest side of a /gzpixelart picture
  #   loadouts:  saved loadouts per brush
  # Example: smaller brushes for everyone, bigger ones for builders.
  #   default:
  #     radius: 12
  #     blocks: 100000
  #   ranks:
  #     builder:
  #       radius: 32
  #       blocks: 500000
  #     architect:
  #       radius: 64
  #       blocks: 2000000
  #       image: 512
  default: {}
  ranks: {}

preview:
  # Largest edit that can be previewed as ghost blocks, and how long a preview stays.
  max-blocks: 60000
  seconds: 60
