# GZMNBuildtools configuration.
#
# After editing, run /gzmnbuildtools reload or restart the server.

# Features you can switch off. A switched-off module registers no commands,
# listeners or web server. Changes here need a server restart; check the result
# with /gzmnbuildtools modules.
modules:
  masks-and-patterns: true   # #slope, #depth, #byslope, #stripes, ...
  gradient: true             # /gradient, saved gradients, #gradient
  type-replace: true         # /typereplace
  gradient-brush: true       # /gradientbrush (/gb)
  terrain-brushes: true      # /terrainbrush (/tb)
  generators: true           # /gzgen
  splines: true              # /gzspline
  web-editor: true           # browser editor for /gb (needs gradient-brush)

messages:
  # When true, extra per-operation diagnostic messages are shown to players
  # (e.g. per-variant block counts during /typereplace).
  verbose: false

web-editor:
  enabled: true
  port: 8080
  host: 0.0.0.0
  # Address players open in their browser, e.g. "https://build.example.com" when the
  # editor sits behind a proxy. Empty = http://<server-ip or localhost>:<port>.
  public-url: ""
  # How long a personal /gb web link keeps working.
  session-minutes: 30

terrain-brushes:
  # Largest radius /terrainbrush accepts. FAWE's own limits (worldedit.limit) still apply.
  max-radius: 32

generation:
  # Largest number of blocks a single /gzgen shape may place.
  max-blocks: 500000

smart-gradient:
  # Largest connected build the gradient brush scans from a click, in blocks and
  # in distance from the clicked block. Bigger areas use the scanned part.
  max-scan-blocks: 200000
  max-scan-radius: 128
  # How long a scanned build is remembered so later strokes line up with it.
  cache-minutes: 10
  # Largest brush radius /gradientbrush accepts.
  max-radius: 32

palettes:
  # Blocks automatic palettes never use (glob patterns, * = anything). Leave
  # this out to use the built-in list of functional, light-emitting, falling
  # and patterned blocks.
  # exclude: ["*_ore", "sand", "gravel"]

preview:
  # Largest edit that can be previewed as ghost blocks, and how long a preview stays.
  max-blocks: 60000
  seconds: 60
