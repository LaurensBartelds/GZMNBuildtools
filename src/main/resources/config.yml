# GZMNBuildtools configuration.
#
# After editing, run /gzmnbuildtools reload or restart the server.

messages:
  # When true, extra per-operation diagnostic messages are shown to players
  # (e.g. per-variant block counts during /typereplace).
  verbose: false

web-editor:
  enabled: true
  port: 8080
  host: 0.0.0.0

terrain-brushes:
  # Largest radius /terrainbrush accepts. FAWE's own limits (worldedit.limit) still apply.
  max-radius: 32

generation:
  # Largest number of blocks a single /gzgen shape may place.
  max-blocks: 500000
